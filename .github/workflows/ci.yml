name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # CPU PyTorch keeps the job small; the training tests use tiny synthetic data.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[train,dev]"
      - run: ruff check src tests
      - run: pytest -q
        env:
          KERAS_BACKEND: torch
          FLWR_TELEMETRY_ENABLED: "0"
      # The demo site must match the committed run files. This runs before the step below, which rewrites
      # results/paper/bootstrap_vs_D.csv with fewer draws than the committed file.
      - run: python site/build_data.py --check
      # Table I must still rebuild exactly from the committed run files.
      - run: python -m windturbine summarise --runs results/paper --out results/paper --boot 200
      - run: git diff --exit-code -- results/paper/table_I.md
      # The walkthrough notebook must still run end to end on the committed files.
      - run: pip install nbclient ipykernel
      - run: >-
          python -c "import nbformat; from nbclient import NotebookClient;
          nb = nbformat.read('notebooks/reproduce.ipynb', as_version=4);
          NotebookClient(nb, timeout=600, kernel_name='python3', resources={'metadata': {'path': 'notebooks'}}).execute()"
