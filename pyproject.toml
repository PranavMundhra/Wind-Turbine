[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "windturbine"
version = "0.1.0"
description = "Leak-free federated normal-behaviour models on CARE to Compare Wind Farm C"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "pyyaml"]
license = {text = "MIT"}

[project.optional-dependencies]
# Training: Keras 3 on the PyTorch backend (set in windturbine/__init__.py). Versions of the paper runs
# are in requirements-lock.txt. Scoring, the audit and the summary need none of these.
train = ["torch>=2.11", "keras>=3.15,<4", "flwr==1.40.0", "dp-accounting>=0.6", "pyarrow", "scikit-learn",
         "scipy", "matplotlib"]
dev = ["pytest", "ruff", "pre-commit"]

[project.scripts]
windturbine = "windturbine.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src", "tests", "scripts"]
extend-exclude = ["notebooks"]
