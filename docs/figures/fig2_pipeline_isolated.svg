<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="980" height="520" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c3cad3"/></marker></defs><text x="490.0" y="30" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="600">Arm A — event-isolated</text><text x="490.0" y="51" font-size="12" fill="#6b7684" text-anchor="middle" font-weight="normal">58 independent models. Nothing crosses an event boundary.</text><rect x="26" y="68" width="928" height="330" rx="8" fill="none" stroke="#4a6fa5" stroke-width="1.2" stroke-dasharray="5 4"/><text x="46" y="88" font-size="11.5" fill="#4a6fa5" text-anchor="start" font-weight="700">for each of the 58 event files  ⟳</text><rect x="46" y="110" width="168" height="92" rx="4" fill="#8a8f98" fill-opacity="0.1" stroke="#8a8f98" stroke-width="1"/><rect x="46" y="110" width="168" height="92" rx="5" fill="none" stroke="#8a8f98" stroke-width="1.4"/><text x="130.0" y="129" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="700">1 · read one event</text><text x="130.0" y="147" font-size="10.2" fill="#6b7684" text-anchor="middle" font-weight="normal" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">event_N.parquet</text><text x="130.0" y="161" font-size="10.2" fill="#6b7684" text-anchor="middle" font-weight="normal" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">243 avg cols only</text><text x="130.0" y="175" font-size="10.2" fill="#6b7684" text-anchor="middle" font-weight="normal" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">~55k rows</text><line x1="222" y1="156" x2="250" y2="156" stroke="#c3cad3" stroke-width="1.5" marker-end="url(#ah)"/><rect x="250" y="110" width="168" height="92" rx="4" fill="#4a6fa5" fill-opacity="0.1" stroke="#4a6fa5" stroke-width="1"/><rect x="250" y="110" width="168" height="92" rx="5" fill="none" stroke="#4a6fa5" stroke-width="1.4"/><text x="334.0" y="129" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="700">2 · filter to normal</text><text x="334.0" y="147" font-size="10.2" fill="#6b7684" text-anchor="middle" font-weight="normal" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">train_test == train</text><text x="334.0" y="161" font-size="10.2" fill="#6b7684" text-anchor="middle" font-weight="normal" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">status ∈ {0, 2}</text><text x="334.0" y="175" font-size="10.2" fill="#6b7684" text-anchor="middle" font-weight="normal" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">power-curve check</text><text x="334.0" y="189" font-size="10.2" fill="#6b7684" text-anchor="middle" font-weight="normal" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">→ ~38k rows</text><line x1="426" y1="156" x2="454" y2="156" stroke="#c3cad3" stroke-width="1.5" marker-end="url(#ah)"/><rect x="454" y="110" width="200" height="92" rx="4" fill="#4a6fa5" fill-opacity="0.1" stroke="#4a6fa5" stroke-width="1"/><rect x="454" y="110" width="200" height="92" rx="5" fill="none" stroke="#4a6fa5" stroke-width="1.4"/><text x="554.0" y="129" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="700">3 · blocked split</text><text x="554.0" y="147" font-size="10.2" fill="#6b7684" text-anchor="middle" font-weight="normal" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">5-day blocks, every 7th</text><text x="554.0" y="161" font-size="10.2" fill="#6b7684" text-anchor="middle" font-weight="normal" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">→ val (15%)</text><text x="554.0" y="175" font-size="10.2" fill="#6b7684" text-anchor="middle" font-weight="normal" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">spans full season</text><line x1="662" y1="156" x2="690" y2="156" stroke="#c3cad3" stroke-width="1.5" marker-end="url(#ah)"/><rect x="690" y="110" width="244" height="92" rx="4" fill="#4a6fa5" fill-opacity="0.1" stroke="#4a6fa5" stroke-width="1"/><rect x="690" y="110" width="244" height="92" rx="5" fill="none" stroke="#4a6fa5" stroke-width="1.4"/><text x="812.0" y="129" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="700">4 · fit scaler + model</text><text x="812.0" y="147" font-size="10.2" fill="#6b7684" text-anchor="middle" font-weight="normal" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">StandardScaler on train only</text><text x="812.0" y="161" font-size="10.2" fill="#6b7684" text-anchor="middle" font-weight="normal" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">NaN → 0 AFTER scaling</text><text x="812.0" y="175" font-size="10.2" fill="#6b7684" text-anchor="middle" font-weight="normal" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">autoencoder, early stop p=10</text><path d="M 812 202 L 812 228 L 300 228 L 300 250" fill="none" stroke="#c3cad3" stroke-width="1.5" marker-end="url(#ah)"/><rect x="196" y="250" width="208" height="88" rx="4" fill="#b5651d" fill-opacity="0.1" stroke="#b5651d" stroke-width="1"/><rect x="196" y="250" width="208" height="88" rx="5" fill="none" stroke="#b5651d" stroke-width="1.4"/><text x="300.0" y="269" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="700">5 · threshold</text><text x="300.0" y="287" font-size="10.2" fill="#6b7684" text-anchor="middle" font-weight="normal" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">99th pct of ||x−x̂||₂</text><text x="300.0" y="301" font-size="10.2" fill="#6b7684" text-anchor="middle" font-weight="normal" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">on THIS event's val rows</text><text x="300.0" y="315" font-size="10.2" fill="#6b7684" text-anchor="middle" font-weight="normal" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">→ one thr per event</text><line x1="412" y1="294" x2="440" y2="294" stroke="#c3cad3" stroke-width="1.5" marker-end="url(#ah)"/><rect x="440" y="250" width="208" height="88" rx="4" fill="#b5651d" fill-opacity="0.1" stroke="#b5651d" stroke-width="1"/><rect x="440" y="250" width="208" height="88" rx="5" fill="none" stroke="#b5651d" stroke-width="1.4"/><text x="544.0" y="269" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="700">6 · score own window</text><text x="544.0" y="287" font-size="10.2" fill="#6b7684" text-anchor="middle" font-weight="normal" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">train_test == prediction</text><text x="544.0" y="301" font-size="10.2" fill="#6b7684" text-anchor="middle" font-weight="normal" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">score > thr → flag</text><text x="544.0" y="315" font-size="10.2" fill="#6b7684" text-anchor="middle" font-weight="normal" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">SAME event only</text><line x1="656" y1="294" x2="684" y2="294" stroke="#c3cad3" stroke-width="1.5" marker-end="url(#ah)"/><rect x="684" y="250" width="208" height="88" rx="4" fill="#8a8f98" fill-opacity="0.1" stroke="#8a8f98" stroke-width="1"/><rect x="684" y="250" width="208" height="88" rx="5" fill="none" stroke="#8a8f98" stroke-width="1.4"/><text x="788.0" y="269" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="700">7 · store record</text><text x="788.0" y="287" font-size="10.2" fill="#6b7684" text-anchor="middle" font-weight="normal" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">time_stamp, normal_mask</text><text x="788.0" y="301" font-size="10.2" fill="#6b7684" text-anchor="middle" font-weight="normal" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">scores, prediction</text><path d="M 788 338 L 788 362 L 150 362 L 150 206" fill="none" stroke="#c3cad3" stroke-width="1.5" marker-end="url(#ah)"/><text x="470" y="356" font-size="10" fill="#6b7684" text-anchor="middle" font-weight="normal" font-style="italic">next event</text><rect x="46" y="420" width="420" height="76" rx="4" fill="#3f7d58" fill-opacity="0.1" stroke="#3f7d58" stroke-width="1"/><rect x="46" y="420" width="420" height="76" rx="5" fill="none" stroke="#3f7d58" stroke-width="1.4"/><text x="256.0" y="439" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="700">8 · CARE over all 58 records</text><text x="256.0" y="457" font-size="10.2" fill="#6b7684" text-anchor="middle" font-weight="normal" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Coverage · Earliness · Reliability · Accuracy</text><text x="256.0" y="471" font-size="10.2" fill="#6b7684" text-anchor="middle" font-weight="normal" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">criticality counter, threshold 72</text><line x1="474" y1="458" x2="502" y2="458" stroke="#c3cad3" stroke-width="1.5" marker-end="url(#ah)"/><rect x="502" y="420" width="432" height="76" rx="4" fill="#3f7d58" fill-opacity="0.1" stroke="#3f7d58" stroke-width="1"/><rect x="502" y="420" width="432" height="76" rx="5" fill="none" stroke="#3f7d58" stroke-width="1.4"/><text x="718.0" y="439" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="700">9 · isolation audit</text><text x="718.0" y="457" font-size="10.2" fill="#6b7684" text-anchor="middle" font-weight="normal" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">own prediction fps vs own training fps</text><text x="718.0" y="471" font-size="10.2" fill="#6b7684" text-anchor="middle" font-weight="normal" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">13 / 158,528 = 0.008% → collision floor, not leakage</text></svg>