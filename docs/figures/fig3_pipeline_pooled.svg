<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="980" height="520" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c3cad3"/></marker></defs><text x="490.0" y="30" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="600">Arm B — pooled (fleet-wide)</text><text x="490.0" y="51" font-size="12" fill="#6b7684" text-anchor="middle" font-weight="normal">One model for all 58 events. Rows duplicated across files enter training.</text><rect x="46" y="78" width="190" height="96" rx="4" fill="#8a8f98" fill-opacity="0.1" stroke="#8a8f98" stroke-width="1"/><rect x="46" y="78" width="190" height="96" rx="5" fill="none" stroke="#8a8f98" stroke-width="1.4"/><text x="141.0" y="97" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="700">1 · read all 58</text><text x="141.0" y="115" font-size="10.2" fill="#6b7684" text-anchor="middle" font-weight="normal" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">one at a time</text><text x="141.0" y="129" font-size="10.2" fill="#6b7684" text-anchor="middle" font-weight="normal" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">243 avg cols</text><text x="141.0" y="143" font-size="10.2" fill="#6b7684" text-anchor="middle" font-weight="normal" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">2.56M normal rows</text><line x1="244" y1="126" x2="272" y2="126" stroke="#c3cad3" stroke-width="1.5" marker-end="url(#ah)"/><rect x="272" y="78" width="226" height="96" rx="4" fill="#4a6fa5" fill-opacity="0.1" stroke="#4a6fa5" stroke-width="1"/><rect x="272" y="78" width="226" height="96" rx="5" fill="none" stroke="#4a6fa5" stroke-width="1.4"/><text x="385.0" y="97" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="700">2 · split by TURBINE</text><text x="385.0" y="115" font-size="10.2" fill="#6b7684" text-anchor="middle" font-weight="normal" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">19 turbines → train (2.28M)</text><text x="385.0" y="129" font-size="10.2" fill="#6b7684" text-anchor="middle" font-weight="normal" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">3 turbines → val (275k)</text><text x="385.0" y="143" font-size="10.2" fill="#6b7684" text-anchor="middle" font-weight="normal" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">NOT by event: duplicated</text><text x="385.0" y="157" font-size="10.2" fill="#6b7684" text-anchor="middle" font-weight="normal" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">rows would straddle</text><line x1="506" y1="126" x2="534" y2="126" stroke="#c3cad3" stroke-width="1.5" marker-end="url(#ah)"/><rect x="534" y="78" width="190" height="96" rx="4" fill="#4a6fa5" fill-opacity="0.1" stroke="#4a6fa5" stroke-width="1"/><rect x="534" y="78" width="190" height="96" rx="5" fill="none" stroke="#4a6fa5" stroke-width="1.4"/><text x="629.0" y="97" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="700">3 · fit scaler</text><text x="629.0" y="115" font-size="10.2" fill="#6b7684" text-anchor="middle" font-weight="normal" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">training turbines only</text><text x="629.0" y="129" font-size="10.2" fill="#6b7684" text-anchor="middle" font-weight="normal" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">one global mean/scale</text><line x1="732" y1="126" x2="760" y2="126" stroke="#c3cad3" stroke-width="1.5" marker-end="url(#ah)"/><rect x="760" y="78" width="174" height="96" rx="4" fill="#4a6fa5" fill-opacity="0.1" stroke="#4a6fa5" stroke-width="1"/><rect x="760" y="78" width="174" height="96" rx="5" fill="none" stroke="#4a6fa5" stroke-width="1.4"/><text x="847.0" y="97" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="700">4 · fit ONE model</text><text x="847.0" y="115" font-size="10.2" fill="#6b7684" text-anchor="middle" font-weight="normal" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">same architecture</text><text x="847.0" y="129" font-size="10.2" fill="#6b7684" text-anchor="middle" font-weight="normal" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">batch 64</text><text x="847.0" y="143" font-size="10.2" fill="#6b7684" text-anchor="middle" font-weight="normal" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">early stop p=10</text><path d="M 847 174 L 847 198 L 300 198 L 300 224" fill="none" stroke="#c3cad3" stroke-width="1.5" marker-end="url(#ah)"/><rect x="150" y="224" width="220" height="88" rx="4" fill="#b5651d" fill-opacity="0.1" stroke="#b5651d" stroke-width="1"/><rect x="150" y="224" width="220" height="88" rx="5" fill="none" stroke="#b5651d" stroke-width="1.4"/><text x="260.0" y="243" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="700">5 · global threshold</text><text x="260.0" y="261" font-size="10.2" fill="#6b7684" text-anchor="middle" font-weight="normal" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">99th pct on held-out</text><text x="260.0" y="275" font-size="10.2" fill="#6b7684" text-anchor="middle" font-weight="normal" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">TURBINE val rows</text><text x="260.0" y="289" font-size="10.2" fill="#6b7684" text-anchor="middle" font-weight="normal" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">→ one thr for all 58</text><line x1="378" y1="268" x2="406" y2="268" stroke="#c3cad3" stroke-width="1.5" marker-end="url(#ah)"/><rect x="406" y="224" width="232" height="88" rx="4" fill="#b5651d" fill-opacity="0.1" stroke="#b5651d" stroke-width="1"/><rect x="406" y="224" width="232" height="88" rx="5" fill="none" stroke="#b5651d" stroke-width="1.4"/><text x="522.0" y="243" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="700">6 · score every window</text><text x="522.0" y="261" font-size="10.2" fill="#6b7684" text-anchor="middle" font-weight="normal" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">pass 2 over all 58 files</text><text x="522.0" y="275" font-size="10.2" fill="#6b7684" text-anchor="middle" font-weight="normal" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">same model, same thr</text><line x1="646" y1="268" x2="674" y2="268" stroke="#c3cad3" stroke-width="1.5" marker-end="url(#ah)"/><rect x="674" y="224" width="220" height="88" rx="4" fill="#3f7d58" fill-opacity="0.1" stroke="#3f7d58" stroke-width="1"/><rect x="674" y="224" width="220" height="88" rx="5" fill="none" stroke="#3f7d58" stroke-width="1.4"/><text x="784.0" y="243" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="700">7 · CARE + leakage</text><text x="784.0" y="261" font-size="10.2" fill="#6b7684" text-anchor="middle" font-weight="normal" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">fingerprint every row</text><text x="784.0" y="275" font-size="10.2" fill="#6b7684" text-anchor="middle" font-weight="normal" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">prediction ∩ training</text><rect x="46" y="348" width="888" height="82" rx="4" fill="#b3373a" fill-opacity="0.07" stroke="#b3373a" stroke-width="1"/><rect x="46" y="348" width="888" height="82" rx="5" fill="none" stroke="#b3373a" stroke-width="1.4"/><text x="490.0" y="370" font-size="12.5" fill="#b3373a" text-anchor="middle" font-weight="700">measured contamination</text><text x="490.0" y="390" font-size="10.8" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">40,216 / 158,528 prediction rows (25.4%) were in the training corpus  ·  27 of 58 events affected</text><text x="490.0" y="408" font-size="10.8" fill="#1f2933" text-anchor="middle" font-weight="normal" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">≈15 of 31 normal events leaked  ·  Accuracy 0.997 (leaked) vs 0.940 (clean)  ·  worth +0.011 CARE</text><rect x="46" y="452" width="888" height="46" rx="4" fill="#f5f7f9" fill-opacity="1.0" stroke="#dde3e9" stroke-width="1"/><text x="490.0" y="471" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="700">why this happens</text><text x="490.0" y="488" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">The published data contains byte-identical rows across event files. A row that is `prediction` in file A is `train` in file B.</text></svg>