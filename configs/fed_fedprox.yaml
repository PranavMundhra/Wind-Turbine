# F3: FedProx stability sweep. mu = 0 is FedAvg with matching solver settings.
# No guaranteed local-only / centralised endpoints; D and C are references.
# One Kaggle session runs one mu: the notebook sets extra.mu from WT_F3_MU.
arm: fedprox
use_lr_plateau: false
extra:
  framework: flwr
  strategy: fedprox
  mu_grid: [0.0, 0.001, 0.01, 0.1, 1.0, 10.0]   # starting grid; refine around the knee
  n_clients: 22
  expected_clients: 22
  expected_events: 58
  fraction_fit: 1.0
  rounds: 100
  local_epochs: 2                  # enough local drift for the proximal term to matter
  max_hours: 11
  aggregation_weight: n_rows_after_leak_removal
  scaler: local
  threshold: local
  expected_dataset_manifest_sha256: 1a43906dd01a0ed2f5a8fee5f40cccda949e6fa85c24c80851c79ae3381165b4  # Kaggle export: bb2ed3ffc84adbf79bbba624941090acd91831097f427b38b2e20885d4b0b1d1
  dataset_override_reason: "Local E03 rebuild (D:/wt_work, 2026-10-26) from the same source CSVs; the Kaggle export bb2ed3ff is not on this machine. Per-turbine train/val counts match the Kaggle D evidence exactly (1,845,037 / 347,569)."
