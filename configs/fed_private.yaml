# F4: secure aggregation (should not change CARE), then record-level DP-SGD.
# Loaded on top of the base strategy config named here; its extra keys are merged in.
# One Kaggle session runs one noise level: the notebook sets dp_noise_multiplier from WT_F4_NOISE.
arm: fed_private
extra:
  base_config: fed_personalised.yaml          # set to the best of F2 / F3 once their results exist
  secure_aggregation: true
  dp_noise_multiplier_grid: [0.0, 0.5, 1.0, 2.0, 4.0]   # 0 = secure aggregation only, no DP-SGD
  dp_clip_norm: 1.0                # per-example L2 clip
  dp_delta: 1.0e-6                 # below 1/rows for every turbine (largest has 155,468)
